run_name: swin_tiny_baseline
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs
model:
  name: swin_tiny_patch4_window7_224
  in_channels: 3
  image_size: 224
  pretrained: true
data:
  batch_size: 32              # Swin attention activations are heavier than ResNet50
  num_workers: 4
  use_sampler: true
train:
  epochs: 30
  optimizer: adamw
  lr: 1.0e-4                  # transformer-friendly LR
  weight_decay: 0.05          # transformer-friendly WD
  scheduler: cosine
  warmup_epochs: 3
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: true
  early_stop_patience: 8
  eval_every: 1
