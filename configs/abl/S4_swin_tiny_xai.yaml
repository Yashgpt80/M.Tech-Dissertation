run_name: S4_swin_tiny_xai
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs
model:
  name: swin_tiny_patch4_window7_224
  in_channels: 3
  image_size: 224
  pretrained: true
data:
  batch_size: 24
  num_workers: 4
  use_sampler: true
train:
  epochs: 18
  optimizer: adamw
  lr: 5.0e-05
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: true
  early_stop_patience: 6
  eval_every: 1
  init_from: runs/swin_tiny_baseline/best.pt
  warmup_xai_epochs: 1
  lambda_attn: 0.5
  attn_loss: cosine
  cam_method: gradcam
  mask_source: landmark
masks:
  npz_path: runs/masks.npz
  cam_size: 7
