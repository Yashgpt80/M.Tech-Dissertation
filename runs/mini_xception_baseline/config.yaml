run_name: mini_xception_baseline
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs
model:
  name: mini_xception
  in_channels: 1
  image_size: 48
  pretrained: false
data:
  batch_size: 128
  num_workers: 4
  use_sampler: true
train:
  epochs: 80
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 3
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: true
  early_stop_patience: 15
  eval_every: 1
_config_path: configs\baseline_mini_xception.yaml
