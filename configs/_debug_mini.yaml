run_name: _debug_mini
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs

model: { name: mini_xception, in_channels: 1, image_size: 48, pretrained: false }
data:  { batch_size: 128, num_workers: 2, use_sampler: true }
train:
  epochs: 3
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: false
  early_stop_patience: 99
  eval_every: 1
