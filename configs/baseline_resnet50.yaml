run_name: resnet50_baseline
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs

model:
  name: resnet50
  in_channels: 3
  image_size: 224
  pretrained: true

data:
  batch_size: 64
  num_workers: 4
  use_sampler: true

train:
  epochs: 40
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: true
  early_stop_patience: 10
  eval_every: 1
