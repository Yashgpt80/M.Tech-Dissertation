run_name: resnet50_xai_guided
seed: 0
csv_path: fer2013.csv
cache_dir: runs/_cache
out_dir: runs

model:
  name: resnet50
  in_channels: 3
  image_size: 224
  pretrained: true

data:
  batch_size: 48
  num_workers: 4
  use_sampler: true

train:
  epochs: 40
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 2
  label_smoothing: 0.1
  use_class_weights: true
  grad_clip: 1.0
  amp: false                 # disabled: double-backward Grad-CAM is more stable in fp32
  early_stop_patience: 10
  eval_every: 1
  # XAI-guided training options:
  init_from: null            # optionally a baseline ckpt path
  warmup_xai_epochs: 3       # epochs of pure CE before enabling attention loss
  lambda_attn: 0.5
  attn_loss: cosine          # cosine | bce | mse
  cam_method: gradcam        # gradcam | gradcam_pp
  mask_source: landmark      # landmark | class_avg | uniform | random  (random = sanity check)

masks:
  npz_path: runs/masks.npz
  cam_size: 14               # spatial size CAM is upsampled to before matching mask
